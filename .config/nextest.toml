# nextest configuration. Run with: cargo nextest run --all-features
#
# Why nextest over `cargo test`:
#   - Each test runs in its own process, so the process-wide state this crate
#     owns (the `OnceLock` config, the panic hook, the breadcrumb ring) cannot
#     leak between tests. Several tests call `init`, which is once-per-process
#     by design — under `cargo test` they would fight over it.
#   - Per-test timeouts turn a hang into a failure. The multi-process tests
#     wait on a spawned monitor; without a timeout a broken handshake would
#     stall CI instead of failing it.
#   - JUnit XML for CI.

[profile.default]
# Hard ceiling per test. The slowest test in the suite takes ~0.3s (a real
# SIGSEGV, out-of-process minidump, and the poll for the report), so anything
# near this is a hang, not a slow test.
slow-timeout = { period = "30s", terminate-after = 4 }
test-threads = "num-cpus"

# The multi-process suite spawns real child processes — up to six at once for
# the lock-contention test, plus a crash monitor that is itself a re-exec of the
# helper binary. Running several of those concurrently on a 2-core CI runner
# oversubscribes it badly enough to look like a timing flake.
#
# `threads-required = "num-test-threads"` makes each one claim every slot, so
# they run strictly alone; the rest of the suite keeps full parallelism the
# moment they finish.
[[profile.default.overrides]]
filter = 'binary(multiprocess)'
test-group = 'multiprocess'
threads-required = 'num-test-threads'

[test-groups]
multiprocess = { max-threads = 1 }

# There is deliberately no separate CI profile.
#
# Retries were tried and removed. The multi-process tests look like the kind of
# thing worth retrying — they spawn processes and shake hands over a socket —
# but what they actually assert is arithmetic: 150 occurrences must be counted
# as 150. When a contended Windows runner produced 148, that was a real lost
# update caused by a lock that could be stolen from a live holder. A retry there
# does not paper over a slow spawn, it hides a concurrency bug. Timeouts, not
# retries, are the right tool for slowness, and `slow-timeout` above covers it.
#
# JUnit output was also removed: nothing consumes it. With `--no-fail-fast` the
# console log already lists every failure, so the XML was an artifact uploaded
# on every run and read by no one. Add it back alongside a reporter that
# actually renders it, not before.
