[package]
name = "blackbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Production black-box recorder: structured crash, corruption, and invariant-violation reports with a flight-recorder breadcrumb trail — debuggable from a report without reproduction or shipped symbols."
repository = "https://github.com/nodedb-lab/blackbox"
homepage = "https://github.com/nodedb-lab/blackbox"
documentation = "https://docs.rs/blackbox"
readme = "README.md"
keywords = ["crash", "diagnostics", "corruption", "reporting", "observability"]
categories = ["development-tools::debugging"]
authors = ["Farhan Syah"]
resolver = "3"

[package.metadata.docs.rs]
all-features = true

[lib]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
